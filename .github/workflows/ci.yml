name: CI

on:
  push:
    branches: [feature/frontend-design-competition]
  pull_request:
    branches: [feature/frontend-design-competition]

permissions:
  contents: read

jobs:
  test:
    name: Vector search service test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vector search integration test (in-memory fallback)
        run: npm run test:vectors
